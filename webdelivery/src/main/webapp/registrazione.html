<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrati — Univaq Food Delivery</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">UFD</span>
      <span class="brand-name">Univaq Food Delivery</span>
    </a>
    <nav class="main-nav" aria-label="Navigazione principale">
      <a href="index.html#menu">Menu</a>
      <a href="index.html#chi-siamo">Chi siamo</a>
      <a href="index.html#dove-siamo">Dove siamo</a>
    </nav>
  </div>
</header>

<main class="auth-main">
  <section class="auth-ticket auth-ticket-wide">
    <p class="ticket-eyebrow">Nuovo cliente</p>
    <h1>Crea il tuo account</h1>
    <p class="auth-sub"></p>

    <form class="auth-form" action="/webdelivery/registrazione" method="post" id="registerForm" novalidate>
      <div class="form-field">
        <label for="nome">Nome e cognome</label>
        <input type="text" id="nome" name="nome" required autocomplete="name" placeholder="Mario Rossi">
        <p class="field-error" id="nomeError" role="alert"></p>
      </div>

      <div class="form-field">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" name="email" required autocomplete="email" placeholder="mario.rossi@email.it">
        <p class="field-error" id="reg-emailError" role="alert"></p>
      </div>

      <div class="form-row-split">
        <div class="form-field">
          <label for="telefono">Telefono</label>
          <input type="tel" id="telefono" name="telefono" required autocomplete="tel"
                 pattern="^[0-9+\s]{6,20}$" placeholder="+39 333 1234567">
          <p class="field-error" id="telefonoError" role="alert"></p>
        </div>
        <div class="form-field">
          <label for="password2">Password</label>
          <input type="password" id="password2" name="password" required minlength="8" autocomplete="new-password">
          <p class="field-hint">Almeno 8 caratteri.</p>
          <p class="field-error" id="password2Error" role="alert"></p>
        </div>
      </div>

      <div class="form-field">
        <label for="indirizzo">Indirizzo di consegna</label>
        <input type="text" id="indirizzo" name="indirizzo" required autocomplete="street-address"
               placeholder="Via, numero civico, città, CAP">
        <p class="field-error" id="indirizzoError" role="alert"></p>
      </div>

      <label class="checkbox-line">
        <input type="checkbox" name="privacy" required>
        Accetto il trattamento dei dati per finalità di consegna
      </label>

      <button type="submit" class="btn btn-stamp btn-full">Crea account</button>

      <p class="auth-switch">Hai già un account? <a href="login.html">Accedi</a></p>
    </form>

    <div class="ticket-tear" aria-hidden="true"></div>
  </section>
</main>

<footer class="site-footer">
  <p>Progetto didattico realizzato per il corso di Web Engineering — Univaq Food Delivery™ è un'attività fittizia.</p>
</footer>

<script src="js/auth.js"></script>
</body>
</html>
